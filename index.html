
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Mi Música</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px 15px 35px;
 background:#080b0a;color:white;
 font-family:Arial,sans-serif;
}
h1{text-align:center;color:#1ed760;font-size:30px}
h3{margin-top:25px}
.sub{text-align:center;color:#aaa}
button,input{
 width:100%;padding:13px;margin:6px 0;
 border:0;border-radius:11px;font-size:15px;
}
button{
 background:#1ed760;color:#071008;
 font-weight:bold;cursor:pointer;
}
button:disabled{opacity:.45}
input{background:#202820;color:white}
.secundario{background:#303a32;color:white}
.azul{background:#245d9c;color:white}
.rojo{background:#783333;color:white}
#estado{text-align:center;color:#1ed760;min-height:22px}
.resultado{
 background:#18201b;padding:13px;
 border-radius:13px;margin:10px 0;
 overflow-wrap:anywhere;
}
.resultado small{color:#aaa}
.resultado button{
 width:auto;display:inline-block;
 padding:9px 12px;font-size:13px;
}
.botones{display:flex;gap:7px;flex-wrap:wrap}
.botones button{flex:1}
audio{width:100%;margin:12px 0}
.panel{
 background:#151d18;padding:15px;
 border-radius:15px;margin-top:15px;
}
#cancionActual{font-weight:bold;text-align:center}
#artistaActual{text-align:center;color:#aaa}
#volumen{width:100%;accent-color:#1ed760}
.etiqueta{color:#aaa;font-size:12px}
footer{text-align:center;color:#777;font-size:12px;margin-top:30px}
</style>
</head>

<body>

<h1>🎵 Mi Música</h1>
<p class="sub">Toda tu música en un solo lugar</p>

<button onclick="conectarSpotify()">🟢 Conectar Spotify</button>
<button class="secundario" onclick="desconectarSpotify()">Desconectar Spotify</button>

<p id="estado">Listo para escuchar música</p>

<input id="busqueda" placeholder="Escribe una canción o artista">

<button onclick="buscarMusica()">🔍 Buscar en todas</button>

<div id="resultados"></div>

<h3>❤️ Mis favoritos</h3>
<div class="botones">
 <button class="secundario" onclick="reproducirFavoritos()">▶ Reproducir favoritos</button>
 <button class="secundario" onclick="mezclarFavoritos()">🔀 Aleatorio</button>
</div>
<div id="favoritos"></div>

<h3>🎧 Reproductor</h3>
<div class="panel">
 <p id="cancionActual">Selecciona una canción</p>
 <p id="artistaActual">Mi Música</p>

 <audio id="reproductor" controls preload="none"></audio>

 <div class="botones">
  <button class="secundario" onclick="anterior()">⏮ Anterior</button>
  <button onclick="alternarReproduccion()" id="playPause">▶ / ⏸</button>
  <button class="secundario" onclick="siguiente()">Siguiente ⏭</button>
 </div>

 <p class="etiqueta">🔊 Volumen</p>
 <input id="volumen" type="range" min="0" max="1" step="0.01" value="1">

 <div class="botones">
  <button class="secundario" id="aleatorio" onclick="alternarAleatorio()">🔀 Aleatorio: NO</button>
  <button class="secundario" onclick="detener()">⏹ Detener</button>
 </div>
</div>

<footer>Mi Música · Tu colección musical</footer>

<script>
"use strict";

const JAMENDO_ID="93852133";
const AUDIUS_API="https://api.audius.co/v1";

const SPOTIFY_CLIENT_ID="38ddc7a29f4345699a81c5fd7685256d";
const SPOTIFY_REDIRECT_URI=
"https://rd2686406-svg.github.io/Mi-Musica/";

const $=id=>document.getElementById(id);
const audio=$("reproductor");

let token=localStorage.getItem("spotify_access_token")||"";
let refreshToken=localStorage.getItem("spotify_refresh_token")||"";
let expiracion=Number(localStorage.getItem("spotify_expiration")||0);

let favoritos=[];
try{
 favoritos=JSON.parse(localStorage.getItem("miMusicaFavoritos")||"[]");
 if(!Array.isArray(favoritos))favoritos=[];
}catch(e){favoritos=[];}

let cancionesDisponibles={};
let cola=[];
let posicion=-1;
let aleatorio=false;

function estado(t){$("estado").textContent=t;}

function escapar(t){
 return String(t||"").replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",
 '"':"&quot;","'":"&#39;"
 })[c]);
}

function guardarDatos(){
 localStorage.setItem("miMusicaFavoritos",JSON.stringify(favoritos));
}

function guardarToken(d){
 token=d.access_token;
 localStorage.setItem("spotify_access_token",token);

 if(d.refresh_token){
  refreshToken=d.refresh_token;
  localStorage.setItem("spotify_refresh_token",refreshToken);
 }

 expiracion=Date.now()+(d.expires_in*1000);
 localStorage.setItem("spotify_expiration",String(expiracion));
}

function base64url(bytes){
 let s="";
 bytes.forEach(b=>s+=String.fromCharCode(b));
 return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}

async function crearChallenge(verifier){
 const digest=await crypto.subtle.digest(
  "SHA-256",new TextEncoder().encode(verifier)
 );
 return base64url(new Uint8Array(digest));
}

async function conectarSpotify(){
 try{
  const verifier=base64url(crypto.getRandomValues(new Uint8Array(64)));
  const challenge=await crearChallenge(verifier);
  const state=base64url(crypto.getRandomValues(new Uint8Array(16)));

  sessionStorage.setItem("spotify_verifier",verifier);
  sessionStorage.setItem("spotify_state",state);

  const params=new URLSearchParams({
   client_id:SPOTIFY_CLIENT_ID,
   response_type:"code",
   redirect_uri:SPOTIFY_REDIRECT_URI,
   code_challenge_method:"S256",
   code_challenge:challenge,
   state
  });

  location.href="https://accounts.spotify.com/authorize?"+params;
 }catch(e){
  alert("No se pudo iniciar Spotify.");
 }
}

async function procesarAutorizacion(){
 const params=new URLSearchParams(location.search);
 const code=params.get("code");
 const state=params.get("state");
 const error=params.get("error");

 if(error){
  history.replaceState({},document.title,location.pathname);
  estado("Spotify no fue autorizado.");
  return;
 }
 if(!code)return;

 const guardado=sessionStorage.getItem("spotify_state");
 const verifier=sessionStorage.getItem("spotify_verifier");

 history.replaceState({},document.title,location.pathname);

 if(!state||state!==guardado||!verifier){
  estado("Error de seguridad al conectar Spotify.");
  return;
 }

 try{
  const r=await fetch("https://accounts.spotify.com/api/token",{
   method:"POST",
   headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body:new URLSearchParams({
    client_id:SPOTIFY_CLIENT_ID,
    grant_type:"authorization_code",
    code,
    redirect_uri:SPOTIFY_REDIRECT_URI,
    code_verifier:verifier
   })
  });

  const d=await r.json();
  if(!r.ok)throw Error(d.error_description||"Autorización fallida");

  guardarToken(d);
  sessionStorage.removeItem("spotify_verifier");
  sessionStorage.removeItem("spotify_state");
  estado("Spotify conectado correctamente 🎵");
 }catch(e){
  estado("Error de Spotify: "+e.message);
 }
}

async function obtenerToken(){
 if(token&&Date.now()<expiracion-60000)return token;
 if(!refreshToken)return "";

 try{
  const r=await fetch("https://accounts.spotify.com/api/token",{
   method:"POST",
   headers:{"Content-Type":"application/x-www-form-urlencoded"},
   body:new URLSearchParams({
    client_id:SPOTIFY_CLIENT_ID,
    grant_type:"refresh_token",
    refresh_token:refreshToken
   })
  });

  const d=await r.json();
  if(!r.ok)throw Error("Token vencido");

  guardarToken(d);
  return token;
 }catch(e){
  token="";
  refreshToken="";
  ["spotify_access_token","spotify_refresh_token","spotify_expiration"]
   .forEach(k=>localStorage.removeItem(k));
  return "";
 }
}

function desconectarSpotify(){
 token="";
 refreshToken="";
 expiracion=0;
 ["spotify_access_token","spotify_refresh_token","spotify_expiration"]
  .forEach(k=>localStorage.removeItem(k));
 estado("Spotify desconectado.");
}

function guardarCancion(c){
 cancionesDisponibles[c.id]=c;
}

function esFavorita(id){
 return favoritos.some(c=>c.id===id);
}

function alternarFavorito(id){
 const c=cancionesDisponibles[id];
 if(!c)return;

 if(esFavorita(id)){
  favoritos=favoritos.filter(x=>x.id!==id);
 }else{
  favoritos.push(c);
 }
 guardarDatos();
 mostrarFavoritos();
 mostrarCanciones(Object.values(cancionesDisponibles));
}

function quitarFavorito(id){
 favoritos=favoritos.filter(c=>c.id!==id);
 guardarDatos();
 mostrarFavoritos();
}

function reproducir(c){
 if(!c||!c.audio){
  if(c&&c.enlace)window.open(c.enlace,"_blank","noopener");
  else alert("Esta canción no tiene reproducción disponible.");
  return;
 }

 audio.src=c.audio;
 $("cancionActual").textContent=c.titulo;
 $("artistaActual").textContent=c.artista;
 audio.play().catch(()=>estado("No se pudo reproducir esta canción."));

 if("mediaSession" in navigator){
  navigator.mediaSession.metadata=new MediaMetadata({
   title:c.titulo,
   artist:c.artista,
   album:c.fuente
  });
  navigator.mediaSession.setActionHandler("play",()=>audio.play());
  navigator.mediaSession.setActionHandler("pause",()=>audio.pause());
  navigator.mediaSession.setActionHandler("previoustrack",anterior);
  navigator.mediaSession.setActionHandler("nexttrack",siguiente);
 }
}

function reproducirPorId(id){
 const lista=Object.values(cancionesDisponibles);
 cola=lista.filter(c=>c.audio);
 posicion=cola.findIndex(c=>c.id===id);
 if(posicion<0){
  const c=cancionesDisponibles[id];
  reproducir(c);
  return;
 }
 reproducir(cola[posicion]);
}

function siguiente(){
 if(!cola.length)return;
 if(aleatorio&&cola.length>1){
  let nueva;
  do{nueva=Math.floor(Math.random()*cola.length);}
  while(nueva===posicion);
  posicion=nueva;
 }else{
  posicion=(posicion+1)%cola.length;
 }
 reproducir(cola[posicion]);
}

function anterior(){
 if(!cola.length)return;
 if(audio.currentTime>3){
  audio.currentTime=0;
  return;
 }
 posicion=(posicion-1+cola.length)%cola.length;
 reproducir(cola[posicion]);
}

audio.addEventListener("ended",()=>{
 if(cola.length)siguiente();
});

function alternarReproduccion(){
 if(audio.paused){
  audio.play().catch(()=>estado("No se pudo iniciar la reproducción."));
 }else{
  audio.pause();
 }
}

function detener(){
 audio.pause();
 audio.currentTime=0;
}

$("volumen").addEventListener("input",e=>{
 audio.volume=Number(e.target.value);
});

function alternarAleatorio(){
 aleatorio=!aleatorio;
 $("aleatorio").textContent="🔀 Aleatorio: "+(aleatorio?"SÍ":"NO");
}

function abrirCancion(id){
 const c=cancionesDisponibles[id];
 if(c&&c.enlace)window.open(c.enlace,"_blank","noopener");
}

function mostrarCanciones(lista){
 const cont=$("resultados");
 lista.forEach(guardarCancion);

 if(!lista.length){
  cont.innerHTML="<p>No se encontraron canciones.</p>";
  return;
 }

 cont.innerHTML=lista.map(c=>`
  <div class="resultado">
   <strong>${escapar(c.titulo)}</strong><br>
   <small>${escapar(c.artista)} · ${escapar(c.fuente)}</small>
   <div class="botones">
    ${c.audio?`<button onclick="reproducirPorId('${escapar(c.id)}')">▶ Escuchar</button>`:""}
    ${c.enlace?`<button class="secundario" onclick="abrirCancion('${escapar(c.id)}')">Abrir</button>`:""}
    <button class="secundario" onclick="alternarFavorito('${escapar(c.id)}')">
     ${esFavorita(c.id)?"❤️ Guardada":"♡ Guardar"}
    </button>
   </div>
  </div>
 `).join("");
}

function mostrarFavoritos(){
 const cont=$("favoritos");
 favoritos.forEach(guardarCancion);

 if(!favoritos.length){
  cont.innerHTML="<p>Todavía no guardaste canciones.</p>";
  return;
 }

 cont.innerHTML=favoritos.map(c=>`
  <div class="resultado">
   <strong>${escapar(c.titulo)}</strong><br>
   <small>${escapar(c.artista)} · ${escapar(c.fuente)}</small>
   <div class="botones">
    ${c.audio?`<button onclick="reproducirFavorito('${escapar(c.id)}')">▶ Escuchar</button>`:""}
    ${c.enlace?`<button class="secundario" onclick="abrirCancion('${escapar(c.id)}')">Abrir</button>`:""}
    <button class="rojo" onclick="quitarFavorito('${escapar(c.id)}')">Quitar</button>
   </div>
  </div>
 `).join("");
}

function reproducirFavorito(id){
 const c=favoritos.find(x=>x.id===id);
 if(!c)return;
 cola=favoritos.filter(x=>x.audio);
 posicion=cola.findIndex(x=>x.id===id);
 reproducir(c);
}

function reproducirFavoritos(){
 cola=favoritos.filter(x=>x.audio);
 if(!cola.length){
  alert("No tienes favoritos reproducibles.");
  return;
 }
 posicion=0;
 reproducir(cola[0]);
}

function mezclarFavoritos(){
 cola=favoritos.filter(x=>x.audio);
 if(!cola.length){
  alert("No tienes favoritos reproducibles.");
  return;
 }
 cola.sort(()=>Math.random()-.5);
 posicion=0;
 reproducir(cola[0]);
}

async function buscarJamendo(q){
 const u=new URL("https://api.jamendo.com/v3.0/tracks/");
 u.search=new URLSearchParams({
  client_id:JAMENDO_ID,
  format:"json",
  search:q,
  limit:"20",
  audioformat:"mp32"
 });
 const r=await fetch(u);
 if(!r.ok)throw Error("Jamendo");
 const d=await r.json();

 return (d.results||[]).map(x=>({
  id:"jamendo-"+x.id,
  titulo:x.name,
  artista:x.artist_name,
  fuente:"Jamendo",
  audio:x.audio||"",
  enlace:x.shareurl||""
 }));
}

async function buscarAudius(q){
 const r=await fetch(
  AUDIUS_API+"/tracks/search?query="+encodeURIComponent(q)+"&limit=20"
 );
 if(!r.ok)throw Error("Audius");
 const d=await r.json();

 return (d.data||[]).map(x=>({
  id:"audius-"+x.id,
  titulo:x.title,
  artista:x.user?.name||"Artista",
  fuente:"Audius",
  audio:AUDIUS_API+"/tracks/"+x.id+"/stream",
  enlace:"https://audius.co"+(x.permalink||"")
 }));
}

async function buscarItunes(q){
 const r=await fetch(
  "https://itunes.apple.com/search?term="+
  encodeURIComponent(q)+"&entity=song&limit=20"
 );
 if(!r.ok)throw Error("iTunes");
 const d=await r.json();

 return (d.results||[]).map(x=>({
  id:"itunes-"+x.trackId,
  titulo:x.trackName,
  artista:x.artistName,
  fuente:"iTunes",
  audio:x.previewUrl||"",
  enlace:x.trackViewUrl||""
 }));
}

async function buscarSpotify(q){
 const access=await obtenerToken();
 if(!access)throw Error("No conectado");

 const r=await fetch(
  "https://api.spotify.com/v1/search?"+
  new URLSearchParams({q,type:"track",limit:"20"}),
  {headers:{Authorization:"Bearer "+access}}
 );
 if(!r.ok)throw Error("Spotify "+r.status);
 const d=await r.json();

 return (d.tracks?.items||[]).map(x=>({
  id:"spotify-"+x.id,
  titulo:x.name,
  artista:x.artists.map(a=>a.name).join(", "),
  fuente:"Spotify",
  audio:"",
  enlace:x.external_urls.spotify
 }));
}

async function buscarMusica(){
 const q=$("busqueda").value.trim();
 if(!q){
  alert("Escribe una canción o artista.");
  return;
 }

 estado("Buscando música...");
 $("resultados").innerHTML="";

 const nombres=["Jamendo","Audius","iTunes","Spotify"];
 const tareas=[
  buscarJamendo(q),
  buscarAudius(q),
  buscarItunes(q),
  buscarSpotify(q)
 ];
 const respuestas=await Promise.allSettled(tareas);

 let canciones=[];
 let errores=[];

 respuestas.forEach((r,i)=>{
  if(r.status==="fulfilled")canciones=canciones.concat(r.value);
  else errores.push(nombres[i]);
 });

 mostrarCanciones(canciones);

 estado(canciones.length+" resultados encontrados."+
  (errores.length?" No respondieron: "+errores.join(", "):""));
}

$("busqueda").addEventListener("keydown",e=>{
 if(e.key==="Enter")buscarMusica();
});

mostrarFavoritos();
procesarAutorizacion();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(()=>estado("No se pudo actualizar el modo aplicación."));
 });
}
</script>
</body>
</html>
