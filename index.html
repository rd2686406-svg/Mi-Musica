
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0a">
<title>Mi Música</title>
<link rel="manifest" href="./manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b0a;color:white;
 font-family:Arial,sans-serif;padding-bottom:120px
}
header{padding:25px 20px;background:#101914}
h1{color:#1ed760;font-size:30px;margin:0}
h2{font-size:21px;margin:22px 0 12px}
p{color:#aaa}
main{max-width:850px;margin:auto;padding:15px}
input,select{
 width:100%;padding:14px;margin:6px 0;
 border:1px solid #303b34;border-radius:10px;
 background:#202822;color:white;font-size:15px
}
button{
 border:0;border-radius:25px;padding:12px 17px;
 background:#1ed760;color:#061008;
 font-weight:bold;cursor:pointer;margin:4px
}
button.secondary{background:#26342c;color:white}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:20px 0}
.tabs button{background:#202822;color:white}
.tabs button.active{background:#1ed760;color:black}
.section{margin:20px 0}
.grid{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px
}
.card{
 background:#151c17;border-radius:12px;
 padding:10px;min-width:0
}
.card img{
 width:100%;aspect-ratio:1;object-fit:cover;
 border-radius:9px;background:#26342c
}
.card b{display:block;margin:9px 0 4px}
.card small{color:#aaa;display:block}
.card button{padding:9px 12px}
.actions{display:flex;flex-wrap:wrap;margin-top:7px}
#status{color:#1ed760;min-height:24px}
#player{
 position:fixed;bottom:0;left:0;right:0;
 background:#17231b;border-top:1px solid #35483a;
 padding:12px 15px calc(12px + env(safe-area-inset-bottom));
 z-index:10
}
.player-inner{max-width:850px;margin:auto}
#playing{display:block;margin-bottom:7px}
audio{width:100%;height:38px}
.hero{
 background:linear-gradient(135deg,#174d2d,#102017);
 padding:20px;border-radius:15px;margin-bottom:20px
}
.empty{color:#aaa;padding:20px;text-align:center}
@media(min-width:600px){
 .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>

<body>
<header>
<h1>♫ Mi Música</h1>
<p>Tu música, tu mundo. 💚</p>
</header>

<main>
<div class="hero">
<h2>¡Bienvenido a Mi Música!</h2>
<p>Descubre canciones y artistas de todo el mundo.</p>
</div>

<section class="section">
<h2>🔎 Buscar música</h2>
<input id="client" placeholder="Client ID de Jamendo">
<button onclick="guardarID()">Guardar conexión</button>
<input id="search" placeholder="Canción, artista o género musical">
<button onclick="buscar()">Buscar música 🔎</button>
</section>

<section class="section">
<h2>🌎 Música por países</h2>
<select id="pais-musica">
<option value="">Elegir país</option>
<option value="Paraguay">🇵🇾 Paraguay</option>
<option value="Argentina">🇦🇷 Argentina</option>
<option value="Brasil">🇧🇷 Brasil</option>
<option value="Mexico">🇲🇽 México</option>
<option value="Colombia">🇨🇴 Colombia</option>
<option value="Chile">🇨🇱 Chile</option>
<option value="Uruguay">🇺🇾 Uruguay</option>
<option value="Peru">🇵🇪 Perú</option>
<option value="Bolivia">🇧🇴 Bolivia</option>
<option value="Venezuela">🇻🇪 Venezuela</option>
<option value="Ecuador">🇪🇨 Ecuador</option>
<option value="España">🇪🇸 España</option>
<option value="Estados Unidos">🇺🇸 Estados Unidos</option>
<option value="Francia">🇫🇷 Francia</option>
<option value="Italia">🇮🇹 Italia</option>
<option value="Portugal">🇵🇹 Portugal</option>
<option value="Alemania">🇩🇪 Alemania</option>
<option value="Reino Unido">🇬🇧 Reino Unido</option>
<option value="Japon">🇯🇵 Japón</option>
<option value="Corea">🇰🇷 Corea</option>
<option value="India">🇮🇳 India</option>
<option value="Canada">🇨🇦 Canadá</option>
<option value="Australia">🇦🇺 Australia</option>
</select>
<button onclick="buscarPais()">Buscar país 🌎</button>
</section>

<div class="tabs">
<button class="active" onclick="cambiarTab('inicio',this)">Inicio</button>
<button onclick="cambiarTab('favoritos',this)">♥ Favoritos</button>
<button onclick="cambiarTab('lista',this)">♫ Mi lista</button>
</div>

<p id="status">Conecta Jamendo para comenzar.</p>
<section class="section">
<div id="songs" class="grid">
<div class="empty">Tus canciones aparecerán aquí.</div>
</div>
</section>
</main>

<div id="player">
<div class="player-inner">
<b id="playing">🎵 Selecciona una canción</b>
<audio id="audio" controls></audio>
</div>
</div>

<script>
const CLIENT_DEFAULT="93852133";
const API="https://api.jamendo.com/v3.0";
let tracks=[];
let favorites=leer("miMusicaFavoritos");
let playlist=leer("miMusicaLista");
let tab="inicio";

const $=id=>document.getElementById(id);

function leer(key){
 try{return JSON.parse(localStorage.getItem(key)||"[]")}
 catch(e){return []}
}

$("client").value=localStorage.getItem("jamendoID")||CLIENT_DEFAULT;

function guardarID(){
 const id=$("client").value.trim();
 if(!id){alert("Escribe tu Client ID");return}
 localStorage.setItem("jamendoID",id);
 $("status").textContent="Conexión guardada 💚";
 cargar();
}

async function pedir(parametros={}){
 const id=$("client").value.trim();
 if(!id)throw Error("Falta el Client ID");

 const datos=new URLSearchParams({
  client_id:id,
  format:"json",
  limit:"50",
  audioformat:"mp32",
  type:"single albumtrack",
  ...parametros
 });

 const respuesta=await fetch(API+"/tracks/?"+datos);
 if(!respuesta.ok)throw Error("Error de conexión: "+respuesta.status);

 const json=await respuesta.json();
 if(!json.results)throw Error("Respuesta inválida de Jamendo");
 return json.results.filter(t=>t.audio);
}

async function cargar(){
 $("status").textContent="Cargando música...";
 try{
  tracks=await pedir({order:"popularity_total"});
  tab="inicio";
  mostrar();
  $("status").textContent=tracks.length+" canciones encontradas 💚";
 }catch(e){
  $("status").textContent="No se pudo cargar. Revisa Internet o tu Client ID.";
 }
}

async function buscar(){
 const q=$("search").value.trim();
 if(!q){
  $("status").textContent="Escribe una canción, artista o género.";
  return;
 }

 $("status").textContent="Buscando en todo el catálogo: "+q+"...";

 try{
  const consultas=await Promise.allSettled([
   pedir({search:q,order:"relevance"}),
   pedir({namesearch:q,order:"relevance"}),
   pedir({artist_name:q,order:"relevance"})
  ]);

  const unicas=new Map();

  consultas.forEach(resultado=>{
   if(resultado.status==="fulfilled"){
    resultado.value.forEach(t=>{
     unicas.set(String(t.id),t);
    });
   }
  });

  tracks=Array.from(unicas.values());
  tab="inicio";
  actualizarTabs();
  mostrar();

  $("status").textContent=tracks.length
   ?tracks.length+" canciones encontradas para "+q+" 💚"
   :"No encontramos canciones con ese nombre. Prueba otro nombre o género.";

 }catch(e){
  $("status").textContent="Error al buscar. Intenta nuevamente.";
 }
}

const etiquetas={
 Paraguay:["paraguayan","folk","polka","guarani"],
 Argentina:["rock","folk","cumbia","tango"],
 Brasil:["samba","bossa nova","brazil"],
 Mexico:["ranchera","mariachi","mexico"],
 Colombia:["cumbia","vallenato","colombia"],
 Chile:["folk","rock","chile"],
 Uruguay:["candombe","folk","uruguay"],
 Peru:["andean","folk","peru"],
 Bolivia:["andean","folk","bolivia"],
 Venezuela:["llanera","folk","venezuela"],
 Ecuador:["andean","folk","ecuador"],
 España:["flamenco","spanish","pop"],
 "Estados Unidos":["country","rock","blues"],
 Francia:["chanson","french","pop"],
 Italia:["italian","pop","rock"],
 Portugal:["fado","portuguese","folk"],
 Alemania:["electronic","rock","german"],
 "Reino Unido":["british","rock","pop"],
 Japon:["japanese","japan","pop"],
 Corea:["korean","korea","pop"],
 India:["indian","india","folk"],
 Canada:["canadian","folk","rock"],
 Australia:["australian","rock","pop"]
};

async function buscarPais(){
 const pais=$("pais-musica").value;
 if(!pais){
  $("status").textContent="Elige un país primero.";
  return;
 }

 $("status").textContent="Buscando música relacionada con "+pais+"...";

 try{
  const estilos=etiquetas[pais]||[pais];

  const respuestas=await Promise.allSettled(
   estilos.map(tag=>pedir({
    fuzzytags:tag,
    order:"popularity_total"
   }))
  );

  const unicas=new Map();

  respuestas.forEach(r=>{
   if(r.status==="fulfilled"){
    r.value.forEach(t=>unicas.set(String(t.id),t));
   }
  });

  tracks=Array.from(unicas.values());
  tab="inicio";
  actualizarTabs();
  mostrar();

  $("status").textContent=tracks.length+
   " canciones relacionadas con "+pais+".";

 }catch(e){
  $("status").textContent="No se pudo buscar en Jamendo.";
 }
}

function actualizarTabs(){
 document.querySelectorAll(".tabs button").forEach(b=>{
  b.classList.remove("active");
 });
 const botones=document.querySelectorAll(".tabs button");
 if(tab==="inicio")botones[0].classList.add("active");
 if(tab==="favoritos")botones[1].classList.add("active");
 if(tab==="lista")botones[2].classList.add("active");
}

function cambiarTab(nombre,boton){
 tab=nombre;
 document.querySelectorAll(".tabs button").forEach(b=>{
  b.classList.remove("active");
 });
 boton.classList.add("active");
 mostrar();
}

function mostrar(){
 const box=$("songs");
 box.innerHTML="";

 let items=tracks;
 if(tab==="favoritos")items=favorites;
 if(tab==="lista")items=playlist;

 if(!items.length){
  box.innerHTML='<div class="empty">Todavía no hay canciones aquí.</div>';
  return;
 }

 items.forEach(t=>{
  const id=String(t.id);
  const card=document.createElement("div");
  card.className="card";

  const img=document.createElement("img");
  img.src=t.album_image||t.image||"";
  img.alt="Portada";
  img.onerror=()=>img.style.visibility="hidden";

  const title=document.createElement("b");
  title.textContent=t.name||"Canción";

  const artist=document.createElement("small");
  artist.textContent=t.artist_name||"Artista";

  const actions=document.createElement("div");
  actions.className="actions";

  const play=document.createElement("button");
  play.textContent="▶";
  play.onclick=()=>reproducir(t);

  const fav=document.createElement("button");
  fav.className="secondary";
  fav.textContent=favorites.some(x=>String(x.id)===id)?"♥":"♡";
  fav.onclick=()=>alternar(favorites,t,"miMusicaFavoritos");

  const add=document.createElement("button");
  add.className="secondary";
  add.textContent=playlist.some(x=>String(x.id)===id)?"✓":"+";
  add.onclick=()=>alternar(playlist,t,"miMusicaLista");

  actions.append(play,fav,add);
  card.append(img,title,artist,actions);
  box.append(card);
 });
}

function alternar(array,cancion,key){
 const id=String(cancion.id);
 const index=array.findIndex(x=>String(x.id)===id);

 if(index>=0)array.splice(index,1);
 else array.push(cancion);

 localStorage.setItem(key,JSON.stringify(array));
 mostrar();
}

function reproducir(t){
 if(!t.audio){
  alert("Audio no disponible");
  return;
 }

 $("playing").textContent=t.name+" — "+t.artist_name;
 $("audio").src=t.audio;

 $("audio").play().catch(()=>{
  $("status").textContent="Pulsa reproducir en el reproductor.";
 });
}

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./service-worker.js")
   .catch(e=>console.log("Service worker:",e));
 });
}

if($("client").value)cargar();
</script>
</body>
</html>
