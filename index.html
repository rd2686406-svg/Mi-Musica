
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0a">
<title>Mi Música</title>
<link rel="manifest" href="manifest.json">

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#080b0a;
 color:white;
 font-family:Arial,sans-serif;
 padding:20px;
}
h1{color:#1ed760;font-size:30px}
h2,h3{color:#1ed760}
p{color:#aaa}
input,select,button{
 border:0;
 border-radius:12px;
 padding:14px;
 font-size:15px;
}
input,select{
 background:#202522;
 color:white;
 width:100%;
 margin:8px 0;
}
button{
 background:#1ed760;
 color:#061008;
 font-weight:bold;
 cursor:pointer;
 margin:4px;
}
.tabs{
 display:flex;
 gap:5px;
 margin:20px 0;
 flex-wrap:wrap;
}
.tabs button{background:#202522;color:white}
.tabs button.active{background:#1ed760;color:black}
.song{
 display:flex;
 align-items:center;
 gap:12px;
 background:#171c19;
 padding:12px;
 margin:10px 0;
 border-radius:12px;
}
.song img{
 width:58px;
 height:58px;
 border-radius:8px;
 object-fit:cover;
}
.song div{flex:1;min-width:0}
.song b{
 display:block;
 overflow:hidden;
 text-overflow:ellipsis;
}
.song small{color:#aaa}
.song button{padding:10px}
#player{
 position:sticky;
 bottom:0;
 background:#101713;
 padding:15px;
 border-radius:15px;
 margin-top:20px;
}
audio{width:100%}
#status,#estado-pais{color:#1ed760}
#musica-paises{
 background:#111713;
 padding:15px;
 border-radius:15px;
 margin:20px 0;
}
</style>
</head>

<body>

<h1>♫ Mi Música</h1>
<p>Toda tu música en un solo lugar 💚</p>

<h3>Conectar Jamendo</h3>
<input id="client" placeholder="Pega aquí tu Client ID de Jamendo">
<button onclick="saveID()">Guardar conexión</button>

<h3>Buscar música</h3>
<input id="search" placeholder="¿Qué canción quieres escuchar?">
<button onclick="searchMusic()">Buscar 🔎</button>

<section id="musica-paises">
<h2>🌎 Música de todos los países</h2>
<p>Elegí un país para buscar música relacionada.</p>

<select id="pais-musica">
<option value="">Elegí un país</option>
<option value="Paraguay">🇵🇾 Paraguay</option>
<option value="Argentina">🇦🇷 Argentina</option>
<option value="Brasil">🇧🇷 Brasil</option>
<option value="Mexico">🇲🇽 México</option>
<option value="Colombia">🇨🇴 Colombia</option>
<option value="Chile">🇨🇱 Chile</option>
<option value="Uruguay">🇺🇾 Uruguay</option>
<option value="Peru">🇵🇪 Perú</option>
<option value="Bolivia">🇧🇴 Bolivia</option>
<option value="Venezuela">🇻🇪 Venezuela</option>
<option value="Ecuador">🇪🇨 Ecuador</option>
<option value="España">🇪🇸 España</option>
<option value="Estados Unidos">🇺🇸 Estados Unidos</option>
<option value="Francia">🇫🇷 Francia</option>
<option value="Italia">🇮🇹 Italia</option>
<option value="Portugal">🇵🇹 Portugal</option>
<option value="Alemania">🇩🇪 Alemania</option>
<option value="Reino Unido">🇬🇧 Reino Unido</option>
<option value="Japon">🇯🇵 Japón</option>
<option value="Corea">🇰🇷 Corea</option>
<option value="India">🇮🇳 India</option>
<option value="Canada">🇨🇦 Canadá</option>
<option value="Australia">🇦🇺 Australia</option>
</select>

<button onclick="buscarMusicaPais()">Buscar por país 🌎</button>
<p id="estado-pais"></p>
<div id="resultados-pais"></div>
</section>

<div class="tabs">
<button class="active" onclick="showTab('music',this)">Inicio</button>
<button onclick="showTab('favorites',this)">♥ Favoritos</button>
<button onclick="showTab('lists',this)">♫ Mi lista</button>
</div>

<p id="status">Conecta Jamendo para comenzar.</p>
<div id="songs"></div>

<div id="player">
<b id="playing">Selecciona una canción</b>
<audio id="audio" controls></audio>
</div>

<script>
const CLIENT_DEFAULT = "93852133";

let tracks = [];
let favorites = [];
let tab = "music";

try{
 favorites = JSON.parse(localStorage.getItem("favorites") || "[]");
}catch(e){
 favorites = [];
}

document.getElementById("client").value =
 localStorage.getItem("jamendoID") || CLIENT_DEFAULT;

function getClientID(){
 return document.getElementById("client").value.trim();
}

function saveID(){
 const id = getClientID();

 if(!id){
  alert("Escribe tu Client ID");
  return;
 }

 localStorage.setItem("jamendoID",id);
 loadMusic();
}

async function pedirCanciones(parametros={}){
 const id = getClientID();

 if(!id) throw new Error("Falta el Client ID");

 const datos = new URLSearchParams({
  client_id:id,
  format:"json",
  limit:"30",
  audioformat:"mp32",
  ...parametros
 });

 const response = await fetch(
  "https://api.jamendo.com/v3.0/tracks/?" + datos.toString()
 );

 if(!response.ok){
  throw new Error("Error de conexión");
 }

 const data = await response.json();

 if(!data.results){
  throw new Error("Respuesta inválida");
 }

 return data.results;
}

async function loadMusic(query=""){
 const id = getClientID();

 if(!id){
  alert("Primero conecta tu Client ID de Jamendo");
  return;
 }

 localStorage.setItem("jamendoID",id);
 document.getElementById("status").textContent =
 "Buscando canciones...";

 try{
  const parametros = {order:"popularity_total"};

  if(query){
   parametros.namesearch = query;
  }

  tracks = await pedirCanciones(parametros);
  tab = "music";
  render();

  document.getElementById("status").textContent =
   tracks.length + " canciones encontradas 💚";

 }catch(error){
  document.getElementById("status").textContent =
   "Error de conexión. Revisa tu Client ID e Internet.";
 }
}

function searchMusic(){
 const q = document.getElementById("search").value.trim();

 if(q){
  loadMusic(q);
 }
}

async function buscarMusicaPais(){
 const pais = document.getElementById("pais-musica").value;
 const resultados = document.getElementById("resultados-pais");
 const estado = document.getElementById("estado-pais");

 if(!pais){
  estado.textContent = "Primero elegí un país.";
  return;
 }

 if(!getClientID()){
  estado.textContent = "Primero conecta Jamendo.";
  return;
 }

 resultados.innerHTML = "";
 estado.textContent = "Buscando música de " + pais + "...";

 const etiquetas = {
  Argentina:["rock","folk","cumbia","tango"],
  Paraguay:["guarani","folk","paraguay"],
  Brasil:["samba","bossa nova","brazil"],
  Mexico:["ranchera","mariachi","mexico"],
  Colombia:["cumbia","vallenato","colombia"],
  Chile:["folk","rock","chile"],
  Uruguay:["candombe","folk","uruguay"],
  Peru:["andean","folk","peru"],
  Bolivia:["andean","folk","bolivia"],
  Venezuela:["llanera","folk","venezuela"],
  Ecuador:["andean","folk","ecuador"],
  España:["flamenco","spanish","pop"],
  "Estados Unidos":["country","rock","blues"],
  Francia:["chanson","french","pop"],
  Italia:["italian","pop","rock"],
  Portugal:["fado","portuguese","folk"],
  Alemania:["electronic","rock","german"],
  "Reino Unido":["british","rock","pop"],
  Japon:["japanese","japan","pop"],
  Corea:["korean","korea","pop"],
  India:["indian","india","folk"],
  Canada:["canadian","folk","rock"],
  Australia:["australian","rock","pop"]
 };

 try{
  const estilos = etiquetas[pais] || [pais];

  estado.textContent =
   "Buscando canciones de " + pais + "...";

  const respuestas = await Promise.allSettled(
   estilos.map(estilo =>
    pedirCanciones({
     fuzzytags:estilo,
     order:"popularity_total"
    })
   )
  );

  const unicas = new Map();

  respuestas.forEach(respuesta=>{
   if(respuesta.status === "fulfilled"){
    respuesta.value.forEach(cancion=>{
     unicas.set(String(cancion.id),cancion);
    });
   }
  });

  const canciones = Array.from(unicas.values());

  mostrarCancionesPais(canciones);

  if(canciones.length){
   estado.textContent =
    canciones.length + " canciones encontradas relacionadas con " + pais + " 💚";
  }else{
   estado.textContent =
    "Jamendo no tiene resultados disponibles para esta búsqueda.";
  }

 }catch(error){
  console.error(error);
  estado.textContent =
   "Error de conexión con Jamendo. Intenta nuevamente.";
 }
}

function mostrarCancionesPais(canciones){
 const box = document.getElementById("resultados-pais");
 box.innerHTML = "";

 canciones.forEach(cancion=>{
  const div = document.createElement("div");
  div.className = "song";

  const img = document.createElement("img");
  img.src = cancion.album_image || "";
  img.alt = "Portada";

  const info = document.createElement("div");

  const titulo = document.createElement("b");
  titulo.textContent = cancion.name;

  const artista = document.createElement("small");
  artista.textContent = cancion.artist_name;

  info.append(titulo,artista);

  const play = document.createElement("button");
  play.textContent = "▶";
  play.onclick = ()=>playSong(cancion);

  div.append(img,info,play);
  box.appendChild(div);
 });
}

function showTab(name,btn){
 tab = name;

 document.querySelectorAll(".tabs button").forEach(b=>{
  b.classList.remove("active");
 });

 btn.classList.add("active");
 render();
}

function render(){
 const box = document.getElementById("songs");
 box.innerHTML = "";

 let items = tracks;

 if(tab === "favorites" || tab === "lists"){
  items = tracks.filter(t=>
   favorites.includes(String(t.id))
  );
 }

 if(!items.length){
  box.innerHTML = "<p>No hay canciones aquí todavía.</p>";
  return;
 }

 items.forEach(t=>{
  const el = document.createElement("div");
  el.className = "song";

  const img = document.createElement("img");
  img.src = t.album_image || "";
  img.alt = "Portada";

  const info = document.createElement("div");

  const title = document.createElement("b");
  title.textContent = t.name;

  const artist = document.createElement("small");
  artist.textContent = t.artist_name;

  info.append(title,artist);

  const play = document.createElement("button");
  play.textContent = "▶";
  play.onclick = ()=>playSong(t);

  const fav = document.createElement("button");
  fav.textContent = favorites.includes(String(t.id)) ? "♥" : "♡";
  fav.onclick = ()=>toggleFav(t.id);

  el.append(img,info,play,fav);
  box.append(el);
 });
}

function playSong(t){
 if(!t.audio){
  alert("Audio no disponible");
  return;
 }

 document.getElementById("playing").textContent =
  t.name + " - " + t.artist_name;

 const audio = document.getElementById("audio");
 audio.src = t.audio;

 audio.play().catch(()=>{
  alert("Toca el botón de reproducir para escuchar.");
 });
}

function toggleFav(id){
 id = String(id);

 favorites = favorites.includes(id)
  ? favorites.filter(x=>x!==id)
  : [...favorites,id];

 localStorage.setItem("favorites",JSON.stringify(favorites));
 render();
}

if(getClientID()){
 loadMusic();
}
</script>

</body>
</html>
