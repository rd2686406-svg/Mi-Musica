
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b0a">
<title>Mi Música</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;padding:18px;background:#080b0a;color:white;font-family:Arial,sans-serif}
h1{text-align:center;color:#1ed760}
.sub{text-align:center;color:#aaa}
input,select,button{width:100%;padding:14px;margin:7px 0;border:0;border-radius:10px;font-size:16px}
input,select{background:#202820;color:white}
button{background:#1ed760;color:#061006;font-weight:bold;cursor:pointer}
.resultado{background:#18201b;padding:13px;border-radius:12px;margin:10px 0}
.resultado small{color:#aaa}
.resultado button{width:auto;padding:9px 12px;font-size:14px}
#estado{color:#1ed760;text-align:center}
audio{width:100%;margin-top:12px}
</style>
</head>
<body>

<h1>🎵 Mi Música</h1>
<p class="sub">Encuentra tu música favorita</p>

<input id="busqueda" placeholder="Escribe una canción o artista">

<select id="fuente">
<option value="todos">Todas las plataformas</option>
<option value="jamendo">Jamendo</option>
<option value="audius">Audius</option>
<option value="itunes">iTunes</option>
<option value="spotify">Spotify</option>
</select>

<button onclick="buscarMusica()">🔍 Buscar música</button>
<p id="estado"></p>
<div id="resultados"></div>

<h3>❤️ Mis favoritos</h3>
<div id="favoritos"></div>

<h3>🎧 Reproductor</h3>
<p id="cancionActual">Selecciona una canción</p>
<audio id="reproductor" controls></audio>

<script>
const JAMENDO_ID = "93852133";
const AUDIUS_API = "https://api.audius.co/v1";

let favoritos = JSON.parse(localStorage.getItem("miMusicaFavoritos") || "[]");
let cancionesDisponibles = {};

function escapar(texto){
  return String(texto || "").replace(/[&<>"']/g, letra => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[letra]);
}

function reproducir(url,titulo){
  if(!url){alert("Esta canción no se puede reproducir aquí.");return;}
  const audio=document.getElementById("reproductor");
  audio.src=url;
  audio.play().catch(()=>alert("No se pudo reproducir esta canción."));
  document.getElementById("cancionActual").textContent=titulo;
}

function reproducirPorId(id){
  const c=cancionesDisponibles[id];
  if(c) reproducir(c.audio,c.titulo);
}

function abrirEnlacePorId(id){
  const c=cancionesDisponibles[id];
  if(c && c.enlace) window.open(c.enlace,"_blank");
}

function guardarFavoritoPorId(id){
  const c=cancionesDisponibles[id];
  if(!c)return;
  if(favoritos.some(x=>x.id===id)){
    favoritos=favoritos.filter(x=>x.id!==id);
  }else{
    favoritos.push(c);
  }
  localStorage.setItem("miMusicaFavoritos",JSON.stringify(favoritos));
  mostrarFavoritos();
}

function quitarFavorito(id){
  favoritos=favoritos.filter(x=>x.id!==id);
  localStorage.setItem("miMusicaFavoritos",JSON.stringify(favoritos));
  mostrarFavoritos();
}

function reproducirFavorito(id){
  const c=favoritos.find(x=>x.id===id);
  if(c) reproducir(c.audio,c.titulo);
}

function abrirFavorito(id){
  const c=favoritos.find(x=>x.id===id);
  if(c && c.enlace) window.open(c.enlace,"_blank");
}

function mostrarCanciones(lista){
  const contenedor=document.getElementById("resultados");
  cancionesDisponibles=Object.fromEntries(lista.map(c=>[c.id,c]));
  if(!lista.length){
    contenedor.innerHTML="<p>No se encontraron canciones.</p>";
    return;
  }
  contenedor.innerHTML=lista.map(c=>`
    <div class="resultado">
      <strong>${escapar(c.titulo)}</strong><br>
      <small>${escapar(c.artista)} · ${escapar(c.fuente)}</small><br>
      ${c.audio?`<button onclick="reproducirPorId('${escapar(c.id)}')">▶ Escuchar</button>`:""}
      ${c.enlace?`<button onclick="abrirEnlacePorId('${escapar(c.id)}')">Abrir</button>`:""}
      <button onclick="guardarFavoritoPorId('${escapar(c.id)}')">❤️ Guardar</button>
    </div>
  `).join("");
}

function mostrarFavoritos(){
  const contenedor=document.getElementById("favoritos");
  if(!favoritos.length){
    contenedor.innerHTML="<p>Todavía no guardaste canciones.</p>";
    return;
  }
  contenedor.innerHTML=favoritos.map(c=>`
    <div class="resultado">
      <strong>${escapar(c.titulo)}</strong><br>
      <small>${escapar(c.artista)} · ${escapar(c.fuente)}</small><br>
      ${c.audio?`<button onclick="reproducirFavorito('${escapar(c.id)}')">▶ Escuchar</button>`:""}
      ${c.enlace?`<button onclick="abrirFavorito('${escapar(c.id)}')">Abrir</button>`:""}
      <button onclick="quitarFavorito('${escapar(c.id)}')">Quitar</button>
    </div>
  `).join("");
}

async function buscarJamendo(q){
  const url=new URL("https://api.jamendo.com/v3.0/tracks/");
  url.search=new URLSearchParams({
    client_id:JAMENDO_ID,format:"json",search:q,limit:"20",audioformat:"mp32"
  });
  const r=await fetch(url);
  if(!r.ok)throw new Error("Jamendo no respondió");
  const d=await r.json();
  return (d.results||[]).map(x=>({
    id:"jamendo-"+x.id,titulo:x.name,artista:x.artist_name,
    fuente:"Jamendo",audio:x.audio,enlace:x.shareurl
  }));
}

async function buscarAudius(q){
  const url=AUDIUS_API+"/tracks/search?query="+encodeURIComponent(q);
  const r=await fetch(url);
  if(!r.ok)throw new Error("Audius no respondió");
  const d=await r.json();
  return (d.data||[]).map(x=>({
    id:"audius-"+x.id,titulo:x.title,
    artista:x.user?.name||"Artista",fuente:"Audius",
    audio:AUDIUS_API+"/tracks/"+x.id+"/stream",
    enlace:"https://audius.co"+(x.permalink||"")
  }));
}

async function buscarItunes(q){
  const url="https://itunes.apple.com/search?term="+encodeURIComponent(q)+"&entity=song&limit=20";
  const r=await fetch(url);
  if(!r.ok)throw new Error("iTunes no respondió");
  const d=await r.json();
  return (d.results||[]).map(x=>({
    id:"itunes-"+x.trackId,titulo:x.trackName,
    artista:x.artistName,fuente:"iTunes",
    audio:x.previewUrl||"",enlace:x.trackViewUrl
  }));
}

function buscarSpotify(q){
  return [{
    id:"spotify-"+Date.now(),
    titulo:"Resultados de Spotify: "+q,
    artista:"Abrir búsqueda en Spotify",
    fuente:"Spotify",
    audio:"",
    enlace:"https://open.spotify.com/search/"+encodeURIComponent(q)
  }];
}

async function buscarMusica(){
  const q=document.getElementById("busqueda").value.trim();
  const fuente=document.getElementById("fuente").value;
  if(!q){alert("Escribe una canción o artista.");return;}

  document.getElementById("resultados").innerHTML="";
  document.getElementById("estado").textContent="Buscando música...";

  const tareas=[];
  if(fuente==="todos"||fuente==="jamendo")tareas.push(buscarJamendo(q));
  if(fuente==="todos"||fuente==="audius")tareas.push(buscarAudius(q));
  if(fuente==="todos"||fuente==="itunes")tareas.push(buscarItunes(q));
  if(fuente==="todos"||fuente==="spotify")tareas.push(Promise.resolve(buscarSpotify(q)));

  const respuestas=await Promise.allSettled(tareas);
  const canciones=respuestas.filter(x=>x.status==="fulfilled").flatMap(x=>x.value);

  mostrarCanciones(canciones);
  const fallos=respuestas.filter(x=>x.status==="rejected").length;
  document.getElementById("estado").textContent=
    canciones.length+" resultado(s) encontrados"+
    (fallos?" · Algunas plataformas no respondieron.":"");
}

document.getElementById("busqueda").addEventListener("keydown",e=>{
  if(e.key==="Enter")buscarMusica();
});

mostrarFavoritos();

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("./service-worker.js").catch(()=>{});
  });
}
</script>
</body>
</html>
